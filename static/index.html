<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo companion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Demo companion</h1>
      <nav>
        <a href="#storyline" id="nav-storyline">Storyline</a>
        <a href="#readiness" id="nav-readiness">Readiness board</a>
      </nav>
      <div class="draft">
        <button id="draft-button" type="button">Draft storyline</button>

  </header>

    <section id="storyline-view"></section>
    <section id="readiness-view"></section>
  </main>

  <script src="/static/app.js"></script>
